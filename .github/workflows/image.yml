name: image

# Builds the API container and publishes it to the GitHub Container Registry, from which Azure
# Container Apps pulls it.
#
# **Built here rather than in Azure, and not by choice.** `az acr build` is the obvious way to
# build an image without a local Docker daemon, and it is blocked: Azure pauses ACR Tasks for any
# subscription funded by trial credits, which includes Azure for Students. The alternatives were
# a credit card (the reason Cloud Run was rejected) or a local Docker install. Building in
# Actions costs nothing on a public repository, needs no daemon on anybody's laptop, and puts the
# image somewhere Container Apps can pull without credentials.
#
# The image must be **public** for that credential-free pull to work. GitHub creates new packages
# private, so the first successful run needs a one-time visibility change in the repository's
# package settings.

on:
  # Path-filtered rather than every push: this builds a ~1.5 GB image and nothing in `web/`,
  # `tests/` or the README can change what goes into it.
  push:
    branches: [main]
    paths:
      - "api/**"
      - "scripts/**"
      - "data/processed/**"
      - "data/chroma.tar.gz"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercased explicitly below — a registry path must be lowercase and a GitHub owner need not
  # be, so interpolating the owner verbatim is a failure that only appears for some accounts.
  IMAGE: naturalization-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Compute the lowercase image reference
        id: ref
        run: echo "path=${REGISTRY}/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Scoped to this run and expires with it — no personal access token to create, store
          # or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          # Container Apps runs amd64. The runner is amd64 too, so this is a native build rather
          # than emulation — naming it anyway, because the same Dockerfile built on an Apple
          # Silicon laptop would otherwise produce an arm64 image that the platform refuses.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ref.outputs.path }}:latest
            ${{ steps.ref.outputs.path }}:${{ github.sha }}
          # The pip layer is the expensive one and it only changes when a pin changes, so caching
          # it turns a rebuild from minutes into seconds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.ref.outputs.path }}:latest"
            echo "${{ steps.ref.outputs.path }}:${{ github.sha }}"
            echo '```'
            echo
            echo "If this is the first successful run, make the package **public** under"
            echo "Packages > naturalization-api > Package settings, or Container Apps cannot"
            echo "pull it without credentials."
          } >> "$GITHUB_STEP_SUMMARY"
